server:
  port: 8080

spring:
  cloud:
    Gateway:
      server:
        webflux:
      routes:
        - id: Auth
          uri: http://localhost:8082
          predicates:
            - Path=/Auth/**


        - id: Product
          uri: http://localhost:8081
          predicates:
            - Path=/Product/**,/Category/**


        - id: Order
          uri: http://localhost:8083
          predicates:
            - Path=/Order/**


